<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b36">
  <meta name="description" content="Y先生が批判的吟味をした論文集です。公開された文献を分野やキーワードから探せます。">
  <title>Y先生文献の書斎</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script src="./assets/catalog-data.js" defer></script>
  <script src="./assets/catalog.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#catalog">文献一覧へスキップ</a>
  <header class="masthead"><div class="masthead-inner page-width">
    <a class="brand" href="./index.html"><span class="book-symbol" aria-hidden="true"></span>Y先生文献の書斎</a>
    <nav aria-label="ページ内の移動"><a href="#catalog">文献一覧 <span aria-hidden="true">↓</span></a></nav>
  </div></header>
  <main class="page-width">
    <section class="cover" aria-labelledby="cover-title">
      <div class="cover-title"><h1 id="cover-title"><span>Y先生</span><strong>文献の書斎</strong></h1></div>
      <p class="intro">Y先生が批判的吟味をした論文集です。個人的に行っている非公開版より吟味が甘くなっているかもしれません。クローズドの論文は内容が極めて限定的にしか紹介できないし、オープンの論文でも図などの引用は2－3点以内にしています。</p>
    </section>
    <section class="catalog" id="catalog" aria-labelledby="catalog-heading">
      <div class="catalog-header"><h2 id="catalog-heading">文献一覧</h2><p class="count" id="total"></p></div>
      <form role="search" id="search-tools" hidden>
        <div class="search-field"><label for="query">キーワード</label><div class="input-wrap"><span class="search-icon" aria-hidden="true"></span><input type="search" id="query" name="q" placeholder="文献名・要旨・分野から探す" autocomplete="off" enterkeyhint="search"></div></div>
        <div class="category-field"><label for="category">分野</label><select id="category" name="category"><option value="">すべての分野</option></select></div>
        <button class="submit-search" type="submit">検索</button>
      </form>
      <p class="visually-hidden" id="announcement" role="status"></p>
      <ul class="articles" id="articles"></ul>
      <div class="empty" id="empty" hidden><span class="empty-book" aria-hidden="true"><span class="book-symbol"></span></span><h3 id="empty-title"></h3><p id="empty-text"></p><button type="button" id="reset" hidden>検索条件をクリア</button></div>
      <noscript><p>文献の検索と一覧表示にはJavaScriptを有効にしてください。</p></noscript>
    </section>
  </main>
  <footer><div class="page-width footer-inner"><span>Y先生文献の書斎</span><nav aria-label="関連メニュー"><a href="./manage.html">掲載者メニュー</a><a href="#top">ページの先頭へ ↑</a></nav></div></footer>
</body>
</html>
